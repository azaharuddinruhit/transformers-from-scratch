# Publishes the guide to GitHub Pages.
# One-time setup in the repository: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy guide to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish; queue the next one instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Publish the pages and their assets; snippets/ and tools/ stay out of the site.
      - name: Assemble site
        run: |
          test -f index.html
          mkdir -p _site
          cp *.html _site/
          cp -r assets _site/

      # Stamp the version from VERSION (major.minor.patch) into the published site.js.
      - name: Stamp version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "VERSION must be major.minor.patch, got '$VERSION'"; exit 1; }
          sed -i "s/__SITE_VERSION__/$VERSION/" _site/assets/js/site.js
          grep -q "SITE_VERSION='$VERSION'" _site/assets/js/site.js
          echo "Deploying version $VERSION"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
